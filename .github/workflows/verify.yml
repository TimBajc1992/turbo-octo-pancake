name: Preveri trening in Safari
on:
  push:
    branches: [main]
    paths:
      [
        "src/**",
        "e2e/**",
        "package*.json",
        "playwright.config.ts",
        "scripts/build-health-shortcut.py",
        "scripts/test-health-shortcut.py",
        "public/shortcuts/**",
        ".github/workflows/verify.yml",
      ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tezisce-verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_BASE_PATH: /turbo-octo-pancake/
      TEST_BASE_PATH: /turbo-octo-pancake/
      PREVIOUS_RELEASE_DIR: work/previous-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pripravi prejšnjo objavljeno različico za preverjanje posodobitve
        uses: actions/checkout@v4
        with:
          ref: 23b576f55effd789fd753bfe726f33124208536c
          path: work/previous-release
          persist-credentials: false
      - run: npm ci
      - name: Preveri izvor pripravljene Bližnjice
        run: |
          python3 scripts/build-health-shortcut.py work/TEZISCE-Apple-Health.unsigned.shortcut --bundle
          cmp work/TEZISCE-Apple-Health.zip public/shortcuts/TEZISCE-Apple-Health.zip
          python3 scripts/test-health-shortcut.py
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Preveri tokove v Chromium
        run: npm run test:e2e
      - name: Preveri tokove z WebKit kot v Safariju
        run: npm run test:e2e
        env:
          TEST_BROWSER: webkit
      - name: Shrani diagnostiko neuspešnih preizkusov
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failures
          path: test-results/
          retention-days: 3
