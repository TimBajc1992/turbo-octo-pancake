name: Pripravi Apple Health Bližnjico
on:
  push:
    paths:
      - "scripts/build-health-shortcut.py"
      - ".github/workflows/health-shortcut.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sign:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/build-health-shortcut.py "work/TEZISCE Apple Health.shortcut"
      - name: Podpiši z Applovim orodjem brez Developer računa
        run: |
          mkdir -p work/signed
          shortcuts sign --mode anyone --input "work/TEZISCE Apple Health.shortcut" --output "work/signed/TEZISCE Apple Health.shortcut"
          test -s "work/signed/TEZISCE Apple Health.shortcut"
      - uses: actions/upload-artifact@v4
        with:
          name: tezisce-apple-health-shortcut
          path: work/signed/
          retention-days: 7
