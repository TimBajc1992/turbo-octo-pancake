<!doctype html>
<html lang="sl">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Posodobi TEŽIŠČE</title>
  <style>
    body {
      background: #171b18;
      color: #f2f5ec;
      font: 18px/1.5 system-ui;
      max-width: 36rem;
      margin: 12vh auto;
      padding: 1.5rem;
    }
    button,
    a {
      color: #171b18;
      background: #c5ed88;
      padding: 0.8rem 1.2rem;
      border: 0;
      border-radius: 0.7rem;
      font: inherit;
      text-decoration: none;
      display: inline-block;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    p {
      color: #d6dfd1;
    }
  </style>
  <h1>Posodobi TEŽIŠČE</h1>
  <p>
    Najprej shrani spremembe v odprti aplikaciji. Ta postopek naloži novo
    različico in ohrani shranjene treninge, meritve ter povezave naprav.
  </p>
  <button id="update">Posodobi in odpri TEŽIŠČE</button>
  <p id="status" role="status" aria-live="polite"></p>
  <script>
    const button = document.querySelector("#update");
    const status = document.querySelector("#status");
    button.onclick = async () => {
      button.disabled = true;
      status.textContent = "Preverjam novo različico …";
      try {
        if (!("serviceWorker" in navigator)) {
          location.replace("./");
          return;
        }
        const registration = await navigator.serviceWorker.register("./sw.js", {
          scope: "./",
          updateViaCache: "none",
        });
        await registration.update();
        if (registration.installing) {
          const installing = registration.installing;
          await new Promise((resolve, reject) => {
            const timer = setTimeout(
              () =>
                reject(
                  Error(
                    "Priprava traja predolgo. Preveri internet in poskusi znova.",
                  ),
                ),
              30000,
            );
            const check = () => {
              if (["installed", "activated"].includes(installing.state)) {
                clearTimeout(timer);
                resolve();
              }
              if (installing.state === "redundant") {
                clearTimeout(timer);
                reject(Error("Nova različica ni pripravljena. Poskusi znova."));
              }
            };
            installing.addEventListener("statechange", check);
            check();
          });
        }
        if (registration.waiting) {
          await new Promise((resolve, reject) => {
            const timer = setTimeout(
              () => reject(Error("Ponovno odpri to stran in poskusi znova.")),
              15000,
            );
            navigator.serviceWorker.addEventListener(
              "controllerchange",
              () => {
                clearTimeout(timer);
                resolve();
              },
              { once: true },
            );
            registration.waiting.postMessage({ type: "SKIP_WAITING" });
          });
        }
        status.textContent =
          "Različica je pripravljena. Odpiram tvoje podatke …";
        location.replace("./");
      } catch (error) {
        status.textContent =
          (error.message ||
            "Posodobitev ni uspela. Preveri internet in poskusi znova.") +
          " Shranjeni podatki niso bili spremenjeni.";
        button.disabled = false;
      }
    };
  </script>
</html>
